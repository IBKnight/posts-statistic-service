services:
  kafka:
    image: apache/kafka:3.8.1
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the post-events topic with 2 partitions — one per shard
  # below. Partition count MUST equal shard count (see README: partitioning
  # contract), so bump this if you add shard-2.
  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic post-events --partitions 2 --replication-factor 1

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  shard-0:
    build: .
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      - SHARD_ORDINAL=0
      - KAFKA_BROKERS=kafka:9092
      - MINIO_ENDPOINT=minio:9000
    ports:
      - "8081:8080"
      - "9081:9090"

  shard-1:
    build: .
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      - SHARD_ORDINAL=1
      - KAFKA_BROKERS=kafka:9092
      - MINIO_ENDPOINT=minio:9000
    ports:
      - "8082:8080"
      - "9082:9090"
