port: "8080"
# internal_port serves /api/dump, /api/status and /metrics. It must NOT be
# published by the k8s Service/Ingress in front of this deployment — those
# handlers snapshot the whole shard under lock and have no auth of their own.
internal_port: "9090"

log:
  level: "info"

shard:
  ordinal: 0

kafka:
  brokers:
    - "localhost:9092"
  topic: "post-events"
  lag_threshold: 1000

snapshot:
  backup_interval: "1h"

minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin" # here for local start
  bucket: "post-stats"
  use_ssl: false
  # backups accumulate at one object/backup_interval per shard forever unless
  # bounded here; 0 disables expiry.
  backup_retention_days: 30